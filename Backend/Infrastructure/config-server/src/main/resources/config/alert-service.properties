server.port=8085

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/almacen_alert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ consumidor
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.exchange=almacen.exchange
app.rabbitmq.movement.queue=almacen.movement.queue
app.rabbitmq.movement.routing-key=almacen.movement.processed
