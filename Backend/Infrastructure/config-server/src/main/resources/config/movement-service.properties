server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/almacen_movement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.exchange=almacen.exchange
app.rabbitmq.movement.queue=almacen.movement.queue
app.rabbitmq.movement.routing-key=almacen.movement.processed

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.admin.fail-fast=false
app.kafka.topic.inventory-events=almacen.inventory.events

# Circuit Breaker / Resilience4j - Inventory Service
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=4
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.inventoryService.timeout-duration=4s
resilience4j.timelimiter.instances.inventoryService.cancel-running-future=true
